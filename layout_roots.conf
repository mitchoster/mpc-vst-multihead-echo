# MPC Multihead Echo — ROOTS interface.
#
# Reference: a wide echo pedal described by the owner, 2026-10-30 — black chassis,
# green centre panel, gold rules, red status lights, three large metal footswitches
# across the bottom. Everything is geometry and colour; MPC draws labels and values.
#
# GEOMETRY: a widget's `cy` is drawn 86 px above it (shadow y-86), so every cy below
# is the intended art position + 86. Keep that in step with vst/art/make_faceplate.py.
#
# Deliberate deviations (recorded in docs/RE202-FEATURE-MAP.md):
#   * the pedal's four head buttons cannot exist (heads are one enum), so the centre
#     panel carries the 12 mode steps as a 4x3 grid under a drawn head-tick row;
#   * "input level / input behaviour" are TAPE AGE and PREAMP here;
#   * MIX and CHORUS/DROPOUTS/HISS/SPREAD are our own additions and live on page 2,
#     which keeps page 1 as close to the reference pedal as the parameters allow;
#   * the three footswitches are real: WARP, JOG (hold = grab the playhead), TWIST.
#     Bypass is the host's and tap tempo is Paket 2, so no dead switch is drawn;
#   * the `ui` parameter is hidden since 2026-11-01 — Rack and Classic were removed,
#     Roots is the only interface. The parameter stays in the contract so old presets
#     keep their indices.

theme_ink=e8e6dc
theme_ink_dim=cfd0c4
theme_ink_faint=9aa08f
theme_accent=1f8f4a
theme_accent_hi=2fbf63
theme_knob_face=121212
theme_knob_ring=c9a227
theme_knob_dot=f4f1e6
theme_seg_active=1f8f4a
theme_seg_inactive=1a1b1c
theme_seg_active_tx=08150c
theme_lcd=0a0a0a
scale_names=1
label_scale=1.0

[tab PEDAL]
art file=bg_roots.png fit=cover
enum_h cx=178 cy=232 label="TAPE AGE" key=tapeage sw=96
enum_h cx=178 cy=296 label="PREAMP" key=preamp sw=96
knob cx=105 cy=386 r=44 label="SATURATION" key=saturation
knob cx=250 cy=386 r=44 label="WOW" key=wow
meter cx=577 cy=233 w=420 h=34 key=viz_wet strip=viz_strip.png
readout cx=577 cy=282 w=220 h=18 label="FEEDBACK" key=viz_fb
readout cx=470 cy=337 w=180 h=26 label="BPM" key=tempo_bpm
readout cx=680 cy=337 w=180 h=26 label="MS" key=delay_ms
enum_h cx=577 cy=400 label="MODE" key=mode sw=100 rows=3
knob cx=900 cy=246 r=40 label="BASS" key=bass
knob cx=1040 cy=246 r=40 label="TREBLE" key=treble
knob cx=1180 cy=246 r=40 label="REVERB" key=reverb
knob cx=900 cy=406 r=40 label="RATE" key=rate
knob cx=1040 cy=406 r=40 label="INTENSITY" key=intensity
knob cx=1180 cy=406 r=40 label="ECHO" key=echo
picture x=198 y=554 w=104 h=104 key=warp files="switch_off.png,switch_on.png"
button cx=250 cy=606 w=104 h=104 label="" img=hit.png key=warp
picture x=588 y=554 w=104 h=104 key=jog files="switch_off.png,switch_on.png"
button cx=640 cy=606 w=104 h=104 label="" img=hit.png key=jog
picture x=978 y=554 w=104 h=104 key=twist files="switch_off.png,switch_on.png"
button cx=1030 cy=606 w=104 h=104 label="" img=hit.png key=twist

qlinks "PEDAL" = rate,intensity,echo,reverb,bass,treble,saturation,wow

[tab CHARACTER]
art file=bg_roots_char.png fit=cover
enum_h cx=178 cy=296 label="PREAMP" key=preamp sw=96
enum_h cx=178 cy=356 label="WET ONLY" key=wetonly sw=96
enum_h cx=178 cy=420 label="MOTION" key=motion sw=96
knob cx=900 cy=246 r=40 label="CHORUS" key=chorus
knob cx=1040 cy=246 r=40 label="DROPOUTS" key=dropouts
knob cx=1180 cy=246 r=40 label="HISS" key=hiss
knob cx=900 cy=406 r=40 label="MIX" key=mix
knob cx=1040 cy=406 r=40 label="SPREAD" key=spread
knob cx=1180 cy=406 r=40 label="DRIFT" key=drift
enum_h cx=577 cy=232 label="SYNC" key=sync sw=104
enum_h cx=577 cy=316 label="TWIST TYPE" key=twisttype sw=104
enum_h cx=577 cy=400 label="REVERB" key=revmode sw=104
enum_h cx=577 cy=484 label="WARP TYPE" key=warptype sw=104
picture x=198 y=554 w=104 h=104 key=warp files="switch_off.png,switch_on.png"
button cx=250 cy=606 w=104 h=104 label="" img=hit.png key=warp
picture x=588 y=554 w=104 h=104 key=jog files="switch_off.png,switch_on.png"
button cx=640 cy=606 w=104 h=104 label="" img=hit.png key=jog
picture x=978 y=554 w=104 h=104 key=twist files="switch_off.png,switch_on.png"
